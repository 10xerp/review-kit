name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit and integration tests
        run: node --test
      - name: Shellcheck
        run: shellcheck scripts/claude-review/*.sh

  install-claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Claude Code release
        env:
          INPUT_CLAUDE_CODE_VERSION: "2.1.287"
        run: scripts/claude-review/install-claude.sh
