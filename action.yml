name: Claude PR Review
description: Claude Code pull request review for 10X repos, gated on a single parsed verdict.
branding:
  icon: check-circle
  color: blue

inputs:
  anthropic_api_key:
    description: Anthropic API key used by Claude Code.
    required: true
  trusted_base_branch:
    description: Branch the review standards and Claude config are read from. Defaults to the repository default branch.
    required: false
    default: ""
  model:
    description: Claude model passed to --model. Empty uses the Claude Code default.
    required: false
    default: ""
  max_turns:
    description: Maximum agent turns for one review.
    required: false
    default: "40"
  claude_code_version:
    description: Claude Code version to install.
    required: false
    default: "2.1.287"
  path_to_claude_code_executable:
    description: Use this Claude Code executable instead of installing one.
    required: false
    default: ""

outputs:
  verdict:
    description: approve, approve_with_notes, blocked, or skipped (draft PR).
    value: ${{ steps.review.outputs.verdict }}
  record_path:
    description: Path of the review record JSON.
    value: ${{ steps.review.outputs.record_path }}

runs:
  using: composite
  steps:
    - id: review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ github.token }}
        INPUT_TRUSTED_BASE_BRANCH: ${{ inputs.trusted_base_branch }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_MAX_TURNS: ${{ inputs.max_turns }}
        INPUT_CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
        INPUT_PATH_TO_CLAUDE_CODE_EXECUTABLE: ${{ inputs.path_to_claude_code_executable }}
      run: '"$GITHUB_ACTION_PATH/scripts/claude-review/review.sh"'

    - if: always() && steps.review.outputs.record_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: claude-review-record-attempt-${{ github.run_attempt }}
        path: ${{ steps.review.outputs.record_path }}
