name: Claude PR Review
description: Claude Code pull request review for 10X repos (hub review v14), gated on a single verdict.
branding:
  icon: check-circle
  color: blue

inputs:
  claude_code_oauth_token:
    description: Claude Code OAuth token.
    required: true
  review_docs:
    description: >-
      When true, review pull requests that only change Markdown or files under docs/. Image-only
      PRs still skip. Default false keeps hub-style scope (skip docs and images).
    required: false
    default: "false"
  max_turns:
    description: >-
      The most turns the review may take. Typical reviews take 4 to 12, and a large PR reading 60
      or more files needs more. The cap guards against a runaway review, so raise it rather than
      remove it.
    required: false
    default: "60"

outputs:
  verdict:
    description: approved, approve_with_notes, blocked, or skipped (draft PR or nothing to review).
    value: ${{ steps.finalize.outputs.verdict || steps.prep.outputs.verdict }}
  record_path:
    description: Path of review-record.json.
    value: ${{ steps.finalize.outputs.record_path || steps.prep.outputs.record_path }}

runs:
  using: composite
  steps:
    - id: prep
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_REVIEW_DOCS: ${{ inputs.review_docs }}
        CLAUDE_CODE_ACTION_SHA: 1d6de8cb0c237e7c15e9e1bdf973826ebae490cc
      run: '"$GITHUB_ACTION_PATH/scripts/claude-review/prep.sh"'

    - id: install
      if: steps.prep.outputs.review == 'true' && steps.prep.outputs.skip_model != 'true'
      shell: bash
      env:
        CLAUDE_CODE_ACTION_SHA: 1d6de8cb0c237e7c15e9e1bdf973826ebae490cc
      run: '"$GITHUB_ACTION_PATH/scripts/claude-review/install.sh"'

    - id: claude
      if: steps.prep.outputs.review == 'true' && steps.prep.outputs.skip_model != 'true'
      uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        allowed_bots: claude, cursor
        track_progress: true
        use_sticky_comment: true
        path_to_claude_code_executable: ${{ steps.install.outputs.claude_code_path }}
        settings: |
          {
            "permissions": {
              "deny": [
                "Read(.git/**)",
                "Read(**/.git/**)",
                "Grep(.git/**)",
                "Glob(.git/**)",
                "Read(//proc/**)",
                "Grep(//proc/**)",
                "Glob(//proc/**)"
              ]
            }
          }
        # --strict-mcp-config: ignore the repo's .mcp.json; only the action's own MCP servers load.
        # --restricted: ignore repo settings files (PR hooks never run) and drop every built-in tool
        # not named in --tools. Without Bash in --tools, the git commands below are unavailable.
        # The denies above and below narrow what Claude reaches, but Bash with any git command
        # can still print runner files, so they are not a secrets boundary (see README, Security).
        claude_args: |
          --strict-mcp-config
          --restricted
          --tools "Bash,Glob,Grep,Read"
          --disallowedTools "Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
          --model claude-opus-5-5
          --max-turns ${{ inputs.max_turns }}
          --allowedTools "Glob,Grep,LS,Read,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*)"
        prompt: ${{ steps.prep.outputs.prompt }}

    - id: finalize
      if: steps.prep.outputs.review == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        CLAUDE_CODE_ACTION_SHA: 1d6de8cb0c237e7c15e9e1bdf973826ebae490cc
      run: '"$GITHUB_ACTION_PATH/scripts/claude-review/finalize.sh"'

    - if: always() && (steps.finalize.outputs.record_path != '' || steps.prep.outputs.record_path != '')
      uses: actions/upload-artifact@v4
      with:
        name: claude-review-record-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.finalize.outputs.record_path || steps.prep.outputs.record_path }}
        retention-days: 90

    - if: cancelled() && steps.prep.outputs.prior_comment_id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$GITHUB_ACTION_PATH/scripts/claude-review/cancel-cleanup.sh"'
